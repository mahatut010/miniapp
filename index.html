<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заявки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        h2 { text-align: center; font-size: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            font-size: 14px;
        }
        textarea { resize: vertical; height: 80px; }
        #debug { margin-top: 20px; font-size: 12px; color: gray; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Выбор услуги</h2>
    <div class="form-group">
        <label for="service">Что нужно разработать?</label>
        <select id="service">
            <option value="Сайт">Сайт</option>
            <option value="Telegram Бот">Telegram Бот</option>
            <option value="Программа">Программа</option>
            <option value="Мобильное приложение">Приложение</option>
            <option value="Mini App">Mini App приложение</option>
            <option value="VPN сервис">VPN сервис</option>
        </select>
    </div>

    <div class="form-group">
        <label for="contact">Ваш Telegram (@username или номер)</label>
        <input type="text" id="contact" placeholder="@username">
    </div>

    <div class="form-group">
        <label for="comment">Комментарий к заказу</label>
        <textarea id="comment" placeholder="Опишите кратко вашу задачу..."></textarea>
    </div>

    <div id="debug">Лог: Готово к работе</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let debugEl = document.getElementById('debug');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username) {
            document.getElementById('contact').value = '@' + tg.initDataUnsafe.user.username;
        }

        tg.MainButton.text = "Отправить заявку";
        tg.MainButton.show();

        tg.MainButton.onClick(function(){
            debugEl.innerText = "Лог: Кнопка нажата";
            
            let service = document.getElementById('service').value;
            let contact = document.getElementById('contact').value;
            let comment = document.getElementById('comment').value;

            if (!contact) {
                alert('Пожалуйста, укажите контакт для связи.');
                return;
            }

            let data = {
                service: service,
                contact: contact,
                comment: comment
            };

            try {
                let jsonString = JSON.stringify(data);
                debugEl.innerText = "Лог: Отправка данных...";
                tg.sendData(jsonString);
            } catch (err) {
                debugEl.innerText = "Лог Ошибка: " + err.message;
                alert("Ошибка отправки: " + err.message);
            }
        });
    </script>
</body>
</html>
